apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-operators
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ika100/demo-taskboard-gitops
    targetRevision: main
    path: operators/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
