apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: operator-seaweedfs
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: gitops-app
    app.kubernetes.io/component: operator
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://seaweedfs.github.io/seaweedfs-operator
    chart: seaweedfs-operator
    targetRevision: 0.1.45
    helm:
      releaseName: seaweedfs-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: seaweedfs-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
