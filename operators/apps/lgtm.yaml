apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: operator-lgtm
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: gitops-app
    app.kubernetes.io/component: operator
spec:
  project: default
  source:
    repoURL: https://github.com/ika100/demo-taskboard-gitops
    targetRevision: main
    path: operators/lgtm
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
