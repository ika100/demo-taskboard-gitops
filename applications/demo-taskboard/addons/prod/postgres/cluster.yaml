apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: demo-taskboard-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: demo-taskboard
    app.kubernetes.io/managed-by: gitops-app
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-202610260819-standard-trixie@sha256:ed6923f9ba2399cf9070379a353c710c29ced8a294be73986a2c3dae7e599ce3
  storage:
    size: 20Gi
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: demo_taskboard
      owner: demo_taskboard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: demo-taskboard-postgres
