apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-taskboard-dev
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - name: demo-taskboard-api
      - name: demo-taskboard-web
  template:
    metadata:
      name: '{{name}}-dev'
    spec:
      project: default
      source:
        repoURL: https://github.com/ika100/demo-taskboard-gitops
        targetRevision: main
        path: applications/demo-taskboard/overlays/dev/{{name}}
      destination:
        server: https://kubernetes.default.svc
        namespace: demo-taskboard-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
---
