apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-taskboard-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ika100/demo-taskboard-gitops
    targetRevision: main
    path: applications/demo-taskboard
    directory:
      include: applicationset.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
